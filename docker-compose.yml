services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: librereserva
      POSTGRES_PASSWORD: librereserva
      POSTGRES_DB: librereserva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librereserva -d librereserva"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://librereserva:librereserva@db:5432/librereserva
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
